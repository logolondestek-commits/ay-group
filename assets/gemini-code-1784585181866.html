<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AY Group | Real-Time Space Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 1. GÜNEŞ VE IŞIK
        const sunLight = new THREE.PointLight(0xfff7e6, 2, 500);
        sunLight.position.set(-50, 20, -50);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x111122));

        // 2. YILDIZLAR (YOĞUN)
        function createStars(count) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) pos[i] = (Math.random() - 0.5) * 800;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.5, color: 0xffffff }));
        }
        scene.add(createStars(8000));

        // 3. AY (Ana Obje)
        const moon = new THREE.Mesh(
            new THREE.SphereGeometry(5, 64, 64),
            new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9, metalness: 0.1 })
        );
        scene.add(moon);

        // 4. GEZEGENLER
        const planets = [];
        const planetConfigs = [
            { radius: 2, color: 0xff4500, orbit: 25, speed: 0.005 },
            { radius: 3, color: 0x4169e1, orbit: 40, speed: 0.002 }
        ];

        planetConfigs.forEach(cfg => {
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(cfg.radius, 32, 32),
                new THREE.MeshStandardMaterial({ color: cfg.color })
            );
            scene.add(p);
            planets.push({ mesh: p, ...cfg, angle: Math.random() * Math.PI * 2 });
        });

        camera.position.z = 60;

        function animate() {
            requestAnimationFrame(animate);
            
            moon.rotation.y += 0.001;
            
            planets.forEach(p => {
                p.angle += p.speed;
                p.mesh.position.x = Math.cos(p.angle) * p.orbit;
                p.mesh.position.z = Math.sin(p.angle) * p.orbit;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
